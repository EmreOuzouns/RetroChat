name: Build RetroChat Mobile (Android & iOS)

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies & sync Android
        run: |
          npm install
          npx cap sync android
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: retrochat-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies & sync iOS
        run: |
          npm install
          npx cap sync ios
      - name: Build iOS Simulator Archive (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
