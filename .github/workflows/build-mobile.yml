name: Build & Release RetroChat Mobile (Android APK & iOS IPA)

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies & sync Android
        run: |
          npm install
          npx cap sync android
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk retrochat.apk
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrochat-android-apk
          path: retrochat.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies & sync iOS
        run: |
          npm install
          npx cap sync ios
      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install
      - name: Build unsigned iOS app & package .ipa
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../retrochat.ipa Payload
      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrochat-ios-ipa
          path: retrochat.ipa

  release:
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release with direct APK & IPA links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RetroChat Latest (Android APK & iOS IPA)
          make_latest: true
          files: |
            artifacts/retrochat-android-apk/retrochat.apk
            artifacts/retrochat-ios-ipa/retrochat.ipa
